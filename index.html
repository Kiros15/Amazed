<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17191c"><title>Metal Maze Gyro</title><style>
*{box-sizing:border-box}body{margin:0;background:#17191c;color:#fff;font-family:system-ui;padding:12px}.app{max-width:480px;margin:auto}.hud{display:flex;justify-content:space-between;gap:6px;margin:8px 0}.b{background:#292d32;padding:7px 9px;border-radius:99px;font-size:12px;font-weight:800}.wrap{position:relative}canvas{width:100%;height:auto;display:block;border-radius:20px;background:#a97847;box-shadow:0 10px 30px #0008}.overlay{position:absolute;inset:0;background:#111d;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.hidden{display:none!important}button{min-height:48px;border:0;border-radius:14px;padding:0 16px;font-weight:800}.primary{background:#e7b96b;color:#191714}.secondary{background:#30353b;color:white;border:1px solid #484e55}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:11px}.status{text-align:center;min-height:44px;padding:12px 4px;font-weight:750}.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:48px 48px;justify-content:center;gap:5px;margin-top:10px}.dir{padding:0;background:#30353b;color:white;font-size:20px}.up{grid-column:2}.left{grid-row:2}.down{grid-row:2}.right{grid-row:2}.note{font-size:12px;color:#aeb3ba;text-align:center;margin-top:10px}
</style></head><body><main class="app"><h2>METAL MAZE</h2><div class="hud"><span class="b">NIVEL <b id="lv">1</b>/5</span><span class="b">⏱ <b id="tm">0.0</b>s</span><span class="b">💀 <b id="fl">0</b></span></div><div class="wrap"><canvas id="c" width="420" height="600"></canvas><div id="ov" class="overlay"><div><h2>Control por inclinación</h2><p>Coloca el móvil en una posición cómoda y activa los sensores.</p><button id="gyro" class="primary">ACTIVAR GIROSCOPIO</button><div class="actions"><button id="touch" class="secondary">Control táctil</button></div><p id="err"></p></div></div></div><div id="st" class="status">Lleva la bola a la zona verde.</div><div class="actions"><button id="cal" class="secondary">CALIBRAR CENTRO</button><button id="reset" class="secondary">REINICIAR</button></div><div id="pad" class="pad hidden"><button class="dir up" data-k="up">▲</button><button class="dir left" data-k="left">◀</button><button class="dir down" data-k="down">▼</button><button class="dir right" data-k="right">▶</button></div><p class="note">En iPhone: abre la web por HTTPS en Safari y acepta Movimiento y orientación.</p></main><script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),$=i=>document.getElementById(i),keys={up:0,down:0,left:0,right:0};let lv=1,falls=0,start=performance.now(),last=start,dead=0,mode='none',beta=0,gamma=0,zB=0,zG=0,has=0;const ball={x:38,y:38,r:10,vx:0,vy:0};const LS=[
{w:[[0,0,420,15],[0,0,15,600],[405,0,15,600],[0,585,420,15],[78,15,15,190],[78,190,220,15],[283,190,15,200],[125,375,173,15],[125,375,15,125],[125,485,210,15]],h:[[220,105],[220,285],[67,450]],g:[340,520,48,45]},
{w:[[0,0,420,15],[0,0,15,600],[405,0,15,600],[0,585,420,15],[15,95,290,15],[290,95,15,135],[100,215,205,15],[100,215,15,205],[100,405,245,15],[330,295,15,125],[180,505,225,15]],h:[[360,55],[200,160],[55,310],[250,350],[365,465]],g:[25,525,55,45]},
{w:[[0,0,420,15],[0,0,15,600],[405,0,15,600],[0,585,420,15],[85,15,15,145],[85,145,240,15],[310,145,15,110],[135,240,190,15],[135,240,15,165],[135,390,190,15],[310,390,15,115],[75,500,250,15]],h:[[205,80],[370,195],[55,275],[235,315],[370,450]],g:[20,530,48,40]},
{w:[[0,0,420,15],[0,0,15,600],[405,0,15,600],[0,585,420,15],[15,115,325,15],[325,115,15,95],[85,195,255,15],[85,195,15,215],[85,395,255,15],[325,300,15,110],[160,500,245,15]],h:[[370,70],[210,155],[48,265],[215,335],[365,460]],g:[25,525,55,45]},
{w:[[0,0,420,15],[0,0,15,600],[405,0,15,600],[0,585,420,15],[70,15,15,175],[70,175,280,15],[335,175,15,100],[130,260,220,15],[130,260,15,160],[130,405,220,15],[335,405,15,105],[70,495,280,15]],h:[[210,90],[385,230],[50,320],[245,330],[380,535]],g:[85,535,55,35]}];
function reset(){ball.x=38;ball.y=38;ball.vx=ball.vy=0;dead=0;start=performance.now();$('st').textContent='Inclina el móvil para mover la bola.'}
function hit(r){let nx=Math.max(r[0],Math.min(ball.x,r[0]+r[2])),ny=Math.max(r[1],Math.min(ball.y,r[1]+r[3])),dx=ball.x-nx,dy=ball.y-ny;return dx*dx+dy*dy<ball.r*ball.r}
function orient(e){if(typeof e.beta==='number'&&typeof e.gamma==='number'){beta=e.beta;gamma=e.gamma;if(!has){zB=beta;zG=gamma;has=1}}}
async function gyro(){try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Sensor no disponible en este navegador.');if(typeof DeviceOrientationEvent.requestPermission==='function'){let p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('Permiso no concedido.')}window.addEventListener('deviceorientation',orient,true);mode='gyro';$('ov').classList.add('hidden');$('pad').classList.add('hidden');$('st').textContent='Giroscopio activo. Mantén el móvil quieto.';setTimeout(()=>{if(has){zB=beta;zG=gamma;$('st').textContent='✓ Calibrado. ¡Juega!'}else $('st').textContent='No recibo datos: usa Safari + HTTPS.'},700)}catch(e){$('err').textContent=e.message}}
function accel(){return mode==='gyro'&&has?[Math.max(-1,Math.min(1,(gamma-zG)/16)),Math.max(-1,Math.min(1,(beta-zB)/16))]:[(keys.right?1:0)-(keys.left?1:0),(keys.down?1:0)-(keys.up?1:0)]}
function phys(dt){if(dead)return;let[a,b]=accel();ball.vx+=a*470*dt;ball.vy+=b*470*dt;let d=Math.pow(.982,dt*60);ball.vx*=d;ball.vy*=d;let sp=Math.hypot(ball.vx,ball.vy);if(sp>260){ball.vx*=260/sp;ball.vy*=260/sp}let o=ball.x;ball.x+=ball.vx*dt;for(let w of LS[lv-1].w)if(hit(w)){ball.x=o;ball.vx*=-.38;break}o=ball.y;ball.y+=ball.vy*dt;for(let w of LS[lv-1].w)if(hit(w)){ball.y=o;ball.vy*=-.38;break}for(let h of LS[lv-1].h){let dx=ball.x-h[0],dy=ball.y-h[1];if(dx*dx+dy*dy<289){dead=1;falls++;$('fl').textContent=falls;$('st').textContent='● Has caído';setTimeout(reset,650);return}}let g=LS[lv-1].g;if(ball.x>g[0]&&ball.x<g[0]+g[2]&&ball.y>g[1]&&ball.y<g[1]+g[3]){dead=1;if(lv<5){$('st').textContent='✓ NIVEL SUPERADO';setTimeout(()=>{lv++;$('lv').textContent=lv;reset()},700)}else $('st').textContent='🏆 ¡HAS COMPLETADO LOS 5 NIVELES!'}}
function draw(){let L=LS[lv-1],gr=x.createLinearGradient(0,0,420,600);gr.addColorStop(0,'#c89b63');gr.addColorStop(1,'#865938');x.fillStyle=gr;x.fillRect(0,0,420,600);x.globalAlpha=.13;for(let y=20;y<600;y+=30){x.fillStyle='#fff';x.fillRect(0,y,420,2)}x.globalAlpha=1;x.fillStyle='#5f8d5c';x.fillRect(...L.g);x.strokeStyle='#d4edc7';x.lineWidth=3;x.strokeRect(...L.g);x.fillStyle='#dfba82';x.strokeStyle='#503b2e';x.lineWidth=2;for(let w of L.w){x.fillRect(...w);x.strokeRect(...w)}for(let h of L.h){let q=x.createRadialGradient(h[0]-4,h[1]-5,1,h[0],h[1],17);q.addColorStop(0,'#000');q.addColorStop(.7,'#171514');q.addColorStop(1,'#5a4230');x.fillStyle=q;x.beginPath();x.arc(h[0],h[1],17,0,7);x.fill()}x.save();x.shadowColor='#0009';x.shadowBlur=8;x.shadowOffsetY=5;let q=x.createRadialGradient(ball.x-4,ball.y-5,1,ball.x,ball.y,10);q.addColorStop(0,'#fff');q.addColorStop(.2,'#e5e8ea');q.addColorStop(.58,'#8d9397');q.addColorStop(1,'#24272a');x.fillStyle=q;x.beginPath();x.arc(ball.x,ball.y,10,0,7);x.fill();x.restore()}
function loop(n){let dt=Math.min(.025,(n-last)/1000);last=n;phys(dt);draw();if(!dead)$('tm').textContent=((n-start)/1000).toFixed(1);requestAnimationFrame(loop)}
$('gyro').onclick=gyro;$('touch').onclick=()=>{mode='touch';$('ov').classList.add('hidden');$('pad').classList.remove('hidden');$('st').textContent='Modo táctil activo.'};$('cal').onclick=()=>{if(has){zB=beta;zG=gamma;ball.vx=ball.vy=0;$('st').textContent='✓ Centro recalibrado.'}};$('reset').onclick=reset;document.querySelectorAll('[data-k]').forEach(el=>{let k=el.dataset.k;el.onpointerdown=e=>{e.preventDefault();keys[k]=1};el.onpointerup=el.onpointercancel=el.onpointerleave=e=>{e.preventDefault();keys[k]=0}});reset();draw();requestAnimationFrame(loop)})();
</script></body></html>
